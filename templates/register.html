<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | nuance studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #e7dfd5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .register-container {
            background: #ffffff;
            border-radius: 48px;
            max-width: 560px;
            width: 100%;
            padding: 40px 36px 48px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #b68b60;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        
        h2 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #2c2418;
            margin-bottom: 8px;
        }
        
        .sub {
            color: #7f6b58;
            margin-bottom: 32px;
            font-size: 14px;
        }
        
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        
        label {
            font-size: 12px;
            font-weight: 600;
            color: #ad8b66;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2cfbc;
            border-radius: 28px;
            background: #fefaf5;
            font-size: 14px;
        }
        
        input:focus {
            border-color: #b8875a;
            outline: none;
            background: white;
        }
        
        .btn-register {
            background: #2c2418;
            color: white;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            margin-top: 12px;
            cursor: pointer;
        }
        
        .login-redirect {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
        }
        
        .login-redirect a {
            color: #b8875a;
            text-decoration: none;
            font-weight: 600;
        }
        
        @media (max-width: 540px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .register-container {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <a href="/login" class="back-link">← вернуться</a>
        <h2>создать профиль</h2>
        <div class="sub">заполните поля, чтобы записываться онлайн</div>
        
        <form method="post" action="/register">
            <div class="form-row">
                <div class="form-group">
                    <label>имя</label>
                    <input type="text" name="first_name" required>
                </div>
                <div class="form-group">
                    <label>фамилия</label>
                    <input type="text" name="last_name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>телефон</label>
                <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required>
            </div>
            
            <div class="form-group">
                <label>email</label>
                <input type="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>пароль</label>
                <input type="password" name="password" minlength="8" required>
            </div>
            
            <button type="submit" class="btn-register">зарегистрироваться →</button>
        </form>
        
        <div class="login-redirect">
            уже есть аккаунт? <a href="/login">войти</a>
        </div>
    </div>
</body>
</html>
