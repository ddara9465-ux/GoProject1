<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ персонала | nuance studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital@0;1&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #efe7df;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .admin-card {
            background: #ffffff;
            border-radius: 48px;
            width: 460px;
            max-width: 100%;
            padding: 44px 36px 48px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.15);
            border: 1px solid #ece1d4;
        }
        
        .brand {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px dotted #e2cfbc;
        }
        
        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            color: #3a2c1c;
            letter-spacing: -0.2px;
        }
        
        .brand span {
            font-size: 38px;
        }
        
        .admin-badge {
            background: #2c2418;
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #fef3e4;
            display: inline-block;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        
        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #2c2418;
            margin-bottom: 8px;
        }
        
        .greeting {
            color: #8e795e;
            margin-bottom: 32px;
            font-size: 14px;
        }
        
        .input-field {
            margin-bottom: 24px;
        }
        
        .input-field label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #ad8b66;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .input-field input {
            width: 100%;
            background: #fefaf5;
            border: 1.5px solid #e6d6c8;
            padding: 14px 18px;
            border-radius: 36px;
            font-size: 15px;
            transition: 0.2s;
            font-family: 'Inter', monospace;
        }
        
        .input-field input:focus {
            border-color: #b8875a;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px #f3ebe2;
        }
        
        .btn-login {
            background: #2c2418;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-login:hover {
            background: #4a3724;
            transform: scale(0.98);
            gap: 12px;
        }
        
        .client-link {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px dashed #decbb8;
        }
        
        .client-link a {
            color: #a57248;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .client-link a:hover {
            color: #5a3e28;
            gap: 10px;
        }
        
        .error-message {
            background: #ffe6e0;
            border-radius: 32px;
            padding: 12px 18px;
            margin-bottom: 28px;
            color: #bc5a3c;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #bc5a3c;
        }
        
        .lock-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <div class="brand">
            <h1>nuance studio</h1>
            <span>🔐</span>
        </div>
        <div class="admin-badge">● ДОСТУП ПЕРСОНАЛА</div>
        <h2>вход в панель</h2>
        <div class="greeting">только для сотрудников салона</div>
        
        {{if .Error}}
        <div class="error-message">
            <span>⚠️</span> {{.Error}}
        </div>
        {{end}}
        
        <form method="POST" action="/admin-login">
            <div class="input-field">
                <label>логин</label>
                <input type="text" name="login" placeholder="admin" autocomplete="off" required autofocus>
            </div>
            <div class="input-field">
                <label>пароль</label>
                <input type="password" name="password" placeholder="··········" required>
            </div>
            <button type="submit" class="btn-login">
                <span>→</span> войти в панель
            </button>
        </form>
        
        <div class="client-link">
            <a href="/login">← обычный пользователь? войти как клиент</a>
        </div>
    </div>
</body>
</html>
